<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0d"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="redglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a8f52"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- title -->
  <g>
    <circle cx="40" cy="44" r="7" fill="#dc2626"/>
    <text x="60" y="49" fill="#e5e7eb" font-size="22" letter-spacing="6" font-weight="600">RED·AGENT</text>
    <text x="60" y="70" fill="#6b7280" font-size="12" letter-spacing="3">AUTONOMOUS AI RED-TEAMING PIPELINE</text>
  </g>
  <text x="1160" y="49" text-anchor="end" fill="#4b5563" font-size="11" letter-spacing="2">GOOGLE ADK · GEMINI 2.5 (VERTEX AI) · ARIZE PHOENIX</text>

  <!-- ===== TARGET (left) ===== -->
  <g>
    <rect x="40" y="150" width="150" height="110" rx="6" fill="#0e1112" stroke="#1f2937" stroke-width="1"/>
    <text x="115" y="180" text-anchor="middle" fill="#9ca3af" font-size="11" letter-spacing="2">TARGET</text>
    <text x="115" y="205" text-anchor="middle" fill="#e5e7eb" font-size="13">Any AI agent</text>
    <text x="115" y="223" text-anchor="middle" fill="#6b7280" font-size="10">HTTP endpoint</text>
    <text x="115" y="245" text-anchor="middle" fill="#4b5563" font-size="9">tools · prompts · scope</text>
  </g>
  <text x="115" y="285" text-anchor="middle" fill="#4b5563" font-size="9" letter-spacing="1">↓ adapter (any JSON shape)</text>

  <!-- ===== PIPELINE STAGES ===== -->
  <!-- stage geometry: 5 boxes across the top row -->
  <!-- Recon -->
  <g>
    <rect x="230" y="150" width="150" height="110" rx="6" fill="#0e1112" stroke="#2a3441" stroke-width="1"/>
    <text x="305" y="178" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">RECON</text>
    <text x="305" y="202" text-anchor="middle" fill="#cbd5e1" font-size="10">benign probes</text>
    <text x="305" y="219" text-anchor="middle" fill="#cbd5e1" font-size="10">discover tools,</text>
    <text x="305" y="234" text-anchor="middle" fill="#cbd5e1" font-size="10">scope, surface</text>
    <text x="305" y="251" text-anchor="middle" fill="#4b5563" font-size="9">self-discovered</text>
  </g>
  <!-- Strategist -->
  <g>
    <rect x="420" y="150" width="150" height="110" rx="6" fill="#0e1112" stroke="#2a3441" stroke-width="1"/>
    <text x="495" y="178" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">STRATEGIST</text>
    <text x="495" y="202" text-anchor="middle" fill="#cbd5e1" font-size="10">plans categories</text>
    <text x="495" y="219" text-anchor="middle" fill="#cbd5e1" font-size="10">+ attack budget</text>
    <text x="495" y="240" text-anchor="middle" fill="#4b5563" font-size="9">OWASP LLM + Agentic</text>
  </g>
  <!-- Attacker -->
  <g>
    <rect x="610" y="150" width="150" height="110" rx="6" fill="#140d0d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="685" y="178" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">ATTACKER</text>
    <text x="685" y="201" text-anchor="middle" fill="#f87171" font-size="10">single · crescendo</text>
    <text x="685" y="217" text-anchor="middle" fill="#f87171" font-size="10">· AGENTIC</text>
    <text x="685" y="238" text-anchor="middle" fill="#9ca3af" font-size="9">goal-hijack /</text>
    <text x="685" y="251" text-anchor="middle" fill="#9ca3af" font-size="9">tool-misuse</text>
  </g>
  <!-- Analyst -->
  <g>
    <rect x="800" y="150" width="150" height="110" rx="6" fill="#0e1112" stroke="#2a3441" stroke-width="1"/>
    <text x="875" y="178" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">ANALYST</text>
    <text x="875" y="202" text-anchor="middle" fill="#cbd5e1" font-size="10">vuln report</text>
    <text x="875" y="219" text-anchor="middle" fill="#cbd5e1" font-size="10">OWASP + severity</text>
    <text x="875" y="240" text-anchor="middle" fill="#4b5563" font-size="9">deterministic counts</text>
  </g>

  <!-- flow arrows row 1 -->
  <line x1="190" y1="205" x2="226" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="205" x2="416" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="205" x2="606" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="205" x2="796" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- attacker <-> target (the attack loop) -->
  <path d="M660 148 C 540 96, 360 96, 240 146" fill="none" stroke="url(#redglow)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="450" y="92" text-anchor="middle" fill="#dc2626" font-size="9" letter-spacing="1" opacity="0.85">attacks fired at the target (any HTTP endpoint)</text>

  <!-- ===== HUMAN GATE ===== -->
  <g>
    <rect x="800" y="300" width="150" height="70" rx="6" fill="#13100a" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="875" y="328" text-anchor="middle" fill="#d4a72c" font-size="11" letter-spacing="2" font-weight="600">HUMAN GATE</text>
    <text x="875" y="350" text-anchor="middle" fill="#cbd5e1" font-size="10">approval required</text>
  </g>
  <line x1="875" y1="260" x2="875" y2="296" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== DEFENDER ===== -->
  <g>
    <rect x="610" y="300" width="150" height="70" rx="6" fill="#0e1112" stroke="#2a3441" stroke-width="1"/>
    <text x="685" y="328" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">DEFENDER</text>
    <text x="685" y="350" text-anchor="middle" fill="#cbd5e1" font-size="10">hardened prompt + guards</text>
  </g>
  <line x1="800" y1="335" x2="766" y2="335" stroke="#d4a72c" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== VERIFIER ===== -->
  <g>
    <rect x="420" y="300" width="150" height="70" rx="6" fill="#0a120d" stroke="#2a8f52" stroke-width="1.5"/>
    <text x="495" y="328" text-anchor="middle" fill="#2a8f52" font-size="11" letter-spacing="2" font-weight="600">VERIFIER</text>
    <text x="495" y="350" text-anchor="middle" fill="#86efac" font-size="10">re-test → 16 → 0</text>
  </g>
  <line x1="610" y1="335" x2="576" y2="335" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== CI/CD EXPORT ===== -->
  <g>
    <rect x="230" y="300" width="150" height="70" rx="6" fill="#0e1112" stroke="#2a3441" stroke-width="1"/>
    <text x="305" y="328" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2" font-weight="600">CI/CD EXPORT</text>
    <text x="305" y="350" text-anchor="middle" fill="#cbd5e1" font-size="10">regression suite</text>
  </g>
  <line x1="420" y1="335" x2="386" y2="335" stroke="#2a8f52" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="305" y="392" text-anchor="middle" fill="#4b5563" font-size="9">↓ pytest + GitHub Actions — breaches can never silently return</text>

  <!-- ===== PHOENIX EVIDENCE LAYER ===== -->
  <g>
    <rect x="40" y="450" width="910" height="64" rx="6" fill="#0b0f14" stroke="#1e3a5f" stroke-width="1"/>
    <text x="64" y="478" fill="#60a5fa" font-size="11" letter-spacing="2" font-weight="600">ARIZE PHOENIX · TRACING + MCP</text>
    <text x="64" y="498" fill="#94a3b8" font-size="10">every attack → a trace span (prompt · response · tool-calls · verdict · severity) — the forensic evidence behind each finding</text>
  </g>
  <!-- ticks up to each agent -->
  <g stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 3">
    <line x1="305" y1="450" x2="305" y2="372"/>
    <line x1="495" y1="450" x2="495" y2="372"/>
    <line x1="685" y1="450" x2="685" y2="372"/>
    <line x1="875" y1="450" x2="875" y2="372"/>
  </g>

  <!-- ===== RAG MEMORY LAYER ===== -->
  <g>
    <rect x="40" y="540" width="910" height="64" rx="6" fill="#0b0f14" stroke="#3b2f5f" stroke-width="1"/>
    <text x="64" y="568" fill="#a78bfa" font-size="11" letter-spacing="2" font-weight="600">RAG · CHROMADB + GEMINI EMBEDDINGS</text>
    <text x="64" y="588" fill="#94a3b8" font-size="10">technique catalog (how to attack)  +  attack memory (what breached this target before → evolve it) — learns per target over time</text>
  </g>
  <g stroke="#3b2f5f" stroke-width="1" stroke-dasharray="3 3">
    <line x1="495" y1="540" x2="495" y2="514"/>
    <line x1="685" y1="540" x2="685" y2="514"/>
  </g>

  <!-- ===== RIGHT RAIL: pipeline legend / closed loop ===== -->
  <g>
    <rect x="985" y="150" width="175" height="454" rx="6" fill="#0a0c0d" stroke="#1f2937" stroke-width="1"/>
    <text x="1072" y="180" text-anchor="middle" fill="#9ca3af" font-size="11" letter-spacing="2">THE CLOSED LOOP</text>
    <line x1="1005" y1="196" x2="1140" y2="196" stroke="#1f2937" stroke-width="1"/>

    <text x="1005" y="228" fill="#dc2626" font-size="11" font-weight="600">1 · FIND</text>
    <text x="1005" y="246" fill="#6b7280" font-size="9">adaptive attacks land</text>

    <text x="1005" y="280" fill="#60a5fa" font-size="11" font-weight="600">2 · PROVE</text>
    <text x="1005" y="298" fill="#6b7280" font-size="9">Phoenix trace = evidence</text>

    <text x="1005" y="332" fill="#d4a72c" font-size="11" font-weight="600">3 · FIX</text>
    <text x="1005" y="350" fill="#6b7280" font-size="9">human-approved hardening</text>

    <text x="1005" y="384" fill="#2a8f52" font-size="11" font-weight="600">4 · RE-VERIFY</text>
    <text x="1005" y="402" fill="#6b7280" font-size="9">breaches → 0, proven</text>

    <text x="1005" y="436" fill="#a78bfa" font-size="11" font-weight="600">5 · EXPORT</text>
    <text x="1005" y="454" fill="#6b7280" font-size="9">regression gate, forever</text>

    <line x1="1005" y1="478" x2="1140" y2="478" stroke="#1f2937" stroke-width="1"/>
    <text x="1072" y="506" text-anchor="middle" fill="#4b5563" font-size="9">no OSS tool ships</text>
    <text x="1072" y="520" text-anchor="middle" fill="#4b5563" font-size="9">this full loop</text>

    <text x="1072" y="560" text-anchor="middle" fill="#2a8f52" font-size="13" font-weight="700">16 → 0</text>
    <text x="1072" y="578" text-anchor="middle" fill="#6b7280" font-size="9">breaches fixed</text>
    <text x="1072" y="592" text-anchor="middle" fill="#6b7280" font-size="9">&amp; proven (live)</text>
  </g>

  <!-- footer -->
  <text x="40" y="660" fill="#374151" font-size="10" letter-spacing="1">LLM PROPOSES · PYTHON ENFORCES &amp; COUNTS   ·   TYPED JSON CONTRACTS BETWEEN AGENTS   ·   BLACK-BOX ENDPOINT-LEVEL   ·   HUMAN-IN-THE-LOOP</text>
  <text x="40" y="682" fill="#374151" font-size="10" letter-spacing="1">DEPLOYED ON GOOGLE CLOUD RUN — 3 SERVICES (UI · API · TARGET)</text>
</svg>
