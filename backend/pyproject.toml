[project]
name = "redagent-backend"
version = "0.1.0"
description = "RedAgent backend — multi-agent AI safety red-teaming"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "google-adk",
    "google-genai",
    "python-dotenv",
    "arize-phoenix-otel",
    "arize-phoenix-client",
    "mcp",
    "openinference-instrumentation-google-genai",
    # OTel pinned to the line google-adk allows (<=1.41.1); phoenix-otel
    # otherwise pulls 1.42.x and breaks ADK.
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp==1.41.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
